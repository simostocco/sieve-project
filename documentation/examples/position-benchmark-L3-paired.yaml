# Example Phase 12C3B1 paired real/null positional benchmark manifest.
#
# schema_version 2 plans, for every positional strategy, one real-trained and
# one null-trained model plus the per-strategy bootstrap calibration command.
# Planning only: `run_position_benchmark.py --dry-run` never executes.
#
# Paths are resolved relative to this file's directory unless absolute.
# Replace the placeholder dataset, null-artifact, and split-plan paths before
# dry-run. The null artifact must be a strict Phase 12C3A artifact created from
# exactly dataset.preprocessed_data, e.g.:
#
#   python scripts/create_null_baseline.py --strict-lineage \
#       --input ../data/cohort.preprocessed.pt \
#       --output ../data/cohort.null.pt --seed 7
#
# Its lineage sidecar (cohort.null.pt.null-lineage.yaml) is derived
# deterministically and is the sole authority for lineage identity; do not
# restate lineage hashes or the permutation seed here.
schema_version: 2
benchmark_id: posenc_grch37_l3_paired
annotation_level: L3
benchmark_role: primary

paths:
  output_root: ../outputs/position_benchmarks

dataset:
  preprocessed_data: ../data/cohort.preprocessed.pt
  genome_build: GRCh37

training:
  mode: cv
  cv_folds: 5
  seed: 42
  val_split: 0.2
  split_plan: ../splits/l3_primary_split_plan.yaml
  latent_dim: 64
  hidden_dim: 128
  num_heads: 4
  num_attention_layers: 2
  aggregation_method: mean
  classifier_type: flatten
  batch_size: 32
  epochs: 100
  lr: 0.001
  lambda_attr: 0.0
  early_stopping: 10
  gradient_clip: null
  gradient_accumulation_steps: 1
  # v2 requires "off" (quoted: bare off is YAML boolean false);
  # auto/on are label-dependent across real/null.
  class_weighting: "off"
  chunk_size: 3000
  chunk_overlap: 0
  sex_map: null
  pc_map: null
  num_pcs: 0

explanation:
  # v2 CV requires fold 0 (the only fold sharing the post-seed RNG state).
  fold_index: 0
  ig_mode: content
  n_steps: 50
  max_variants: 2000
  aggregation_method: mean

null_baseline:
  artifact: ../data/cohort.null.pt

calibration:
  n_bootstrap: 1000
  seed: 42
  top_k:
    - 50
    - 100
    - 200
    - 500
    - 1000
  exclude_sex_chroms: false
  min_variants_per_gene: 10
  gene_delta_rank_aggregation: max

runtime:
  python: python
  device: cuda
  train_num_workers: 0
  explain_batch_size: 4
  calibration_n_jobs: 1

runs:
  - run_id: legacy
    position:
      position_preset: legacy

  - run_id: no_position
    position:
      position_preset: custom
      absolute_position_encoding: none
      relative_position_encoding: none
      chromosome_encoding: none
      cross_chromosome_policy: separate

  - run_id: sinusoidal
    position:
      position_preset: custom
      absolute_position_encoding: sinusoidal
      relative_position_encoding: none
      chromosome_encoding: none
      cross_chromosome_policy: separate
      position_dim: 64
      sinusoidal_coordinate_scale: 1.0
      sinusoidal_max_wavelength: 10000.0

  - run_id: learned_binned
    position:
      position_preset: custom
      absolute_position_encoding: learned_binned
      relative_position_encoding: none
      chromosome_encoding: none
      cross_chromosome_policy: separate
      position_dim: 64
      position_bin_size: 10000

  - run_id: t5
    position:
      position_preset: custom
      absolute_position_encoding: none
      relative_position_encoding: t5_bucket
      chromosome_encoding: none
      cross_chromosome_policy: separate
      num_position_buckets: 32
      max_position_distance: 100000

  - run_id: rope
    position:
      position_preset: custom
      absolute_position_encoding: none
      relative_position_encoding: rope
      chromosome_encoding: none
      cross_chromosome_policy: separate
      rope_coordinate_scale: 10000.0
      rope_base: 10000.0

  - run_id: alibi_fixed
    position:
      position_preset: custom
      absolute_position_encoding: none
      relative_position_encoding: alibi_fixed
      chromosome_encoding: none
      cross_chromosome_policy: separate
      alibi_distance_function: log1p
      alibi_distance_scale: 10000.0

  - run_id: alibi_learned
    position:
      position_preset: custom
      absolute_position_encoding: none
      relative_position_encoding: alibi_learned
      chromosome_encoding: none
      cross_chromosome_policy: separate
      alibi_distance_function: log1p
      alibi_distance_scale: 10000.0
